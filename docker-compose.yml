services:

  db:
    image: postgres:16
    container_name: sunglass_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./sunglass_backend
    container_name: sunglass_backend
    ports:
      - "8000:8000"
    volumes:
      - ./sunglass_backend:/app
    environment:
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    depends_on:
      - db

  frontend:
    build: ./sunglass_frontend
    container_name: sunglass_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./sunglass_frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data: